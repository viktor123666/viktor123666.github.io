<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Shared clips — ViggeClips</title>
<meta name="description" content="The companies that help us run ViggeClips, and what each one touches."/>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="icon" href="/emblem.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="/cf.css?v=202608161602"/>
<script defer src="/cf.js?v=202608161602"></script>
<meta property="og:title" content="Subprocessors — ViggeClips"/>
<meta property="og:url" content="https://vigge.pro/subprocessors.html"/>
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="ViggeClips"/>
<meta property="og:image" content="https://vigge.pro/og.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:image" content="https://vigge.pro/og.png"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="theme-color" content="#0a0a0b"/>
</head>
<body>
<div class="grid"></div>
<header class="cf"></header>
<section class="first"><div class="w" style="max-width:64rem">
  <div class="head rv"><span class="lbl">Shared clips</span>
    <h1 id="shTitle" style="font-size:clamp(1.5rem,3vw,2.1rem)">Loading…</h1>
    <p class="lede" id="shSub"></p></div>
  <div id="shGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
       gap:1.2rem;margin-top:2.2rem"></div>
  <div class="rv" style="margin-top:3rem;padding:1.4rem;background:var(--panel);
       border-left:3px solid var(--gold);display:flex;gap:1rem;align-items:center;flex-wrap:wrap">
    <p style="margin:0;flex:1;min-width:16rem;color:var(--dim)">These shorts were found,
      cut and captioned automatically from one long recording.</p>
    <a class="b1" href="/?ref=share">Clip your own — free</a>
  </div>
</div></section>
<footer class="cf"></footer>
<script>
(async function(){
  const t=new URLSearchParams(location.search).get("t")||"";
  const h1=document.getElementById("shTitle"), sub=document.getElementById("shSub"),
        grid=document.getElementById("shGrid");
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  try{
    const r=await fetch("/api/share?t="+encodeURIComponent(t));
    const b=await r.json();
    if(!r.ok){ h1.textContent="This link does not lead anywhere.";
      sub.textContent="It may have been turned off by its owner."; return; }
    h1.textContent=b.title||"Shared clips";
    sub.textContent=b.clips.length+(b.clips.length===1?" short":" shorts")+" · picked by the engine";
    grid.innerHTML=b.clips.map(c=>`
      <div style="background:var(--panel);padding:.6rem">
        <video src="${esc(c.url)}" ${c.thumbUrl?`poster="${esc(c.thumbUrl)}"`:""}
               controls preload="metadata" playsinline
               style="width:100%;aspect-ratio:9/16;object-fit:cover;background:var(--bg2)"></video>
        <p style="margin:.5rem 0 0;font-size:.82rem"><b>${esc(c.title||"Untitled")}</b>
          <span class="mono" style="color:var(--dim2);font-size:.68rem"> · ${Math.round(c.seconds)}s</span></p>
      </div>`).join("");
  }catch(e){ h1.textContent="Could not load this page."; }
})();
</script>
</body>
</html>

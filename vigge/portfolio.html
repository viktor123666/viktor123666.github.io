<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Creator portfolio — ViggeClips</title>
<meta name="description" content="The companies that help us run ViggeClips, and what each one touches."/>
<link rel="icon" href="/favicon.ico" sizes="any"/>
<link rel="icon" href="/emblem.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="/cf.css?v=202608161602"/>
<script defer src="/cf.js?v=202608161602"></script>
<meta property="og:title" content="Subprocessors — ViggeClips"/>
<meta property="og:url" content="https://vigge.pro/subprocessors.html"/>
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="ViggeClips"/>
<meta property="og:image" content="https://vigge.pro/og.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:image" content="https://vigge.pro/og.png"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="theme-color" content="#0a0a0b"/>
</head>
<body>
<div class="grid"></div>
<header class="cf"></header>
<section class="first"><div class="w" style="max-width:56rem">
  <div class="head rv"><span class="lbl">Creator portfolio</span>
    <h1 id="pfName" style="font-size:clamp(1.6rem,3.2vw,2.3rem)">Loading…</h1>
    <p class="lede" id="pfSub"></p></div>
  <div id="pfList" style="margin-top:2.4rem;display:flex;flex-direction:column;gap:.7rem"></div>
  <div class="rv" style="margin-top:3rem;padding:1.4rem;background:var(--panel);
       border-left:3px solid var(--gold);display:flex;gap:1rem;align-items:center;flex-wrap:wrap">
    <p style="margin:0;flex:1;min-width:16rem;color:var(--dim)">Every short on this page was
      found, cut and captioned automatically from long recordings.</p>
    <a class="b1" href="/?ref=portfolio">Build yours — free</a>
  </div>
</div></section>
<footer class="cf"></footer>
<script>
(async function(){
  const t=new URLSearchParams(location.search).get("t")||"";
  const nm=document.getElementById("pfName"), sub=document.getElementById("pfSub"),
        list=document.getElementById("pfList");
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmtV=v=>v>=1e6?(v/1e6).toFixed(1)+"M":v>=1e4?(v/1e3).toFixed(0)+"k":String(v);
  try{
    const r=await fetch("/api/portfolio?t="+encodeURIComponent(t));
    const b=await r.json();
    if(!r.ok){ nm.textContent="This link does not lead anywhere.";
      sub.textContent="It may have been turned off by its owner."; return; }
    nm.textContent=b.name;
    sub.textContent=b.clips.length+" published shorts"+
      (b.totalViews>0?" · "+fmtV(b.totalViews)+" views and counting":"");
    if(!b.clips.length){ list.innerHTML='<p style="color:var(--dim)">Nothing published yet — check back soon.</p>'; return; }
    list.innerHTML=b.clips.map(c=>`
      <a href="${esc(c.url)}" target="_blank" rel="noopener"
         style="display:flex;justify-content:space-between;gap:1rem;align-items:baseline;
                padding:.9rem 1.1rem;background:var(--panel);text-decoration:none;color:var(--fg)">
        <span style="flex:1">${esc(c.title||"Untitled short")}</span>
        <span class="mono" style="color:var(--gold2);font-size:.72rem;white-space:nowrap">${
          c.views===null?"WATCH →":fmtV(c.views)+" VIEWS →"}</span>
      </a>`).join("");
  }catch(e){ nm.textContent="Could not load this page."; }
})();
</script>
</body>
</html>
